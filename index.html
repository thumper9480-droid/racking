<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#087f69" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <title>روال • برنامه و عملکرد</title>
    <link rel="stylesheet" href="style.css?v=3.0.1" />
    <script defer src="engine.js?v=3.0.1"></script>
    <script defer src="excel.js?v=3.0.1"></script>
    <script defer src="views.js?v=3.0.1"></script>
    <script defer src="app.js?v=3.0.1"></script>
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand"><b>روال 🌿</b><small>یک روز بهتر، هر روز</small></div>
      <nav id="nav" aria-label="صفحه‌های اصلی"></nav>
      <div class="sidebar-bottom">
        <span class="release">نسخهٔ وب ۳.۰</span>
        <p>اطلاعات روی همین مرورگر می‌ماند.</p>
        <button class="text-button" data-action="nav" data-arg="settings">
          ذخیره و بازیابی اطلاعات
        </button>
      </div>
    </aside>
    <main class="app-main">
      <header class="date-bar">
        <span id="date"></span><span class="local-badge">فضای شخصی من</span>
      </header>
      <div id="storage-warning"></div>
      <section id="view"></section>
      <footer class="app-footer">روال • هر روز یک قدم جلوتر</footer>
    </main>
    <dialog id="dialog"><form id="form" class="stack"></form></dialog>
    <div id="toasts" aria-live="polite"></div>
  </body>
</html>
