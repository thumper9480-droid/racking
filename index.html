<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#087f69" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <title>روال • برنامهٔ امروز</title>
    <link rel="stylesheet" href="style.css?v=2.2.0" />
    <script defer src="engine.js?v=2.2.0"></script>
    <script defer src="excel.js?v=2.2.0"></script>
    <script defer src="app.js?v=2.2.0"></script>
  </head>
  <body>
    <main>
      <header>
        <div>
          <div class="eyebrow">یک روز، یک قدم جلوتر</div>
          <h1>روال <span>🌿</span></h1>
          <p id="date" class="muted"></p>
        </div>
        <div class="badge">نسخهٔ وب • ۲.۲</div>
      </header>
      <div id="storage-warning"></div>
      <nav id="nav" aria-label="صفحه‌های اصلی"></nav>
      <section id="view"></section>
      <footer>
        اطلاعات روی همین مرورگر می‌ماند. برای نگه‌داشتن و انتقال، پشتیبان JSON
        بگیر.<br />یادآوری وب به بازبودن صفحه نیاز دارد؛ زنگ بیدارباش اندروید در
        این نسخه اجرا نمی‌شود.
      </footer>
    </main>
    <dialog id="dialog"><form id="form" class="stack"></form></dialog>
    <div id="toasts" aria-live="polite"></div>
  </body>
</html>
